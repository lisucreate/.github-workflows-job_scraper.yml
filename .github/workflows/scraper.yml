name: Canadian Remote Tech Writer & Contractor Job Scraper

on:
  schedule:
    # Runs automatically every 6 hours (adjust cron syntax if you prefer a different frequency)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows you to trigger manual test runs anytime from the GitHub UI

permissions:
  contents: write

jobs:
  scrape-and-notify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run job scraper
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python scraper.py

      - name: Commit and push updated seen jobs cache
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add seen_jobs.json
          git diff --staged --quiet || git commit -m "Auto-update seen_jobs.json cache [skip ci]"
          git push
